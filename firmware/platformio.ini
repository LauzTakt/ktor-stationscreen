; KTVM firmware for ESP32 (flash once with `./ktesp flash`)
[env:esp32]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 460800
upload_speed = 460800
build_unflags = -Os
build_flags =
    -O2
    -DKTVM_BAUD=460800
    -DCORE_DEBUG_LEVEL=0
